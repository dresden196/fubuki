<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffadbf"/>
      <stop offset="100%" stop-color="#d95d81"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2f6"/>
      <stop offset="100%" stop-color="#f0c3d0"/>
    </linearGradient>
  </defs>
  <!-- A flash drive, plug to the right, the way one lies on a desk before it
       goes in. The plug is the light metal of the other icons' accents rather
       than grey, so the whole thing stays in the palette; the two slots are
       what make a USB-A plug readable at 22px. -->
  <rect x="33" y="18.5" width="11" height="11" rx="1.6" fill="url(#plug)"/>
  <rect x="37" y="21" width="5" height="1.8" rx="0.9" fill="#d95d81" fill-opacity="0.55"/>
  <rect x="37" y="25.2" width="5" height="1.8" rx="0.9" fill="#d95d81" fill-opacity="0.55"/>
  <rect x="4" y="15" width="30" height="18" rx="4.5" fill="url(#body)"/>
  <!-- Activity light where the cap end would be. -->
  <circle cx="9.2" cy="24" r="1.7" fill="#fff2f6" fill-opacity="0.9"/>
  <!-- One notched petal on the body, where a maker's mark goes. -->
  <path d="M24 23 C20.6 26.4 20 31.4 22.3 33.8 C23.2 34.6 23.7 33.1 24 32.2
           C24.3 33.1 24.8 34.6 25.7 33.8 C28 31.4 27.4 26.4 24 23 Z"
        fill="#fff4f7" fill-opacity="0.92" transform="translate(-4 -4.6) rotate(180 24 28.4)"/>
</svg>
